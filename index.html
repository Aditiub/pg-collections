<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Collections · PG Merchant</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#f4f4f4; --surface:#fff; --ink:#25253c; --muted:#606078; --faint:#8b8ba3;
  --line:#eaeaf3; --line2:#d9d9e8; --field:#b4bbcc;
  --primary:#533cd2; --primary-soft:#efecff; --dark:#231f45;
  --green:#12a150; --green-bg:#e6f6ec; --green-ink:#0b6b34;
  --red:#d92d3a; --red-bg:#fdeaea; --red-ink:#b3201f;
  --amber:#f2a100; --amber-bg:#fef3dc; --amber-ink:#8a5200;
  --blue:#2f6bff; --blue-bg:#e8f0ff; --blue-ink:#1e4fc2;
  --panel:#f4f5fa;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14px;line-height:1.3;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
svg{display:block;flex:none}
.shell{display:flex;gap:12px;padding:12px;min-height:100vh}
.side{width:64px;flex:none;position:sticky;top:12px;height:calc(100vh - 24px);background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;align-items:center}
.side .grp{display:flex;flex-direction:column;gap:8px;align-items:center}
.logo{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#6b4ee6,#2a1a80);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;margin-bottom:8px}
.nav{width:40px;height:40px;border-radius:24px;display:grid;place-items:center;color:var(--ink)}
.nav.on{background:var(--dark);color:#fff}
.nav.ai{color:var(--primary)}
.avatar{width:40px;height:40px;border-radius:50%;background:#fff3d6;border:1px solid #e9c46a;display:grid;place-items:center;font-weight:600;font-size:12px;color:#8a5200}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.top{background:var(--surface);border-radius:24px;height:56px;padding:0 12px 0 12px;display:flex;align-items:center;justify-content:space-between}
.top h1{font-size:15px;font-weight:600}
.top .sub{color:var(--faint);font-weight:500;margin-left:8px;font-size:14px}
.top .sub:before{content:"•";margin-right:8px}
.top .r{display:flex;gap:8px;align-items:center}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;background:#fff}
.me{width:40px;height:40px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:600;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi{background:var(--surface);border-radius:20px;padding:16px;display:flex;gap:16px;align-items:center}
.kpi .ic{width:48px;height:48px;border-radius:50%;background:#ececec;display:grid;place-items:center;color:var(--muted)}
.kpi .ic.p{background:var(--primary-soft);color:var(--primary)}
.kpi small{display:block;color:var(--muted);font-size:13px;font-weight:500;margin-bottom:4px}
.kpi b{font-size:22px;font-weight:700;letter-spacing:-.2px}
.card{background:var(--surface);border-radius:24px;padding:16px}
.tools{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;position:relative}
.tools h2{font-size:13px;font-weight:700;padding-left:4px}
.tools .r{display:flex;gap:8px;position:relative}
.search{display:flex;align-items:center;gap:8px;border:.5px solid var(--field);border-radius:24px;padding:10px 12px;width:213px;background:#fff;color:var(--faint)}
.search input{border:0;outline:0;width:100%;font-size:12px;color:var(--ink);background:none}
.pill{display:flex;gap:6px;align-items:center;border:.5px solid var(--field);border-radius:20px;padding:10px 12px;background:#fff;font-size:12px;font-weight:600}
.pill.on{border-color:var(--primary);color:var(--primary)}
table{width:100%;border-collapse:separate;border-spacing:0}
thead th{background:#ececec;font-size:10px;font-weight:500;letter-spacing:.4px;color:var(--muted);text-align:left;padding:10px 12px;text-transform:uppercase}
thead th:first-child{border-radius:12px 0 0 12px}thead th:last-child{border-radius:0 12px 12px 0}
tbody td{padding:0 12px;height:44px;font-size:12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:#fafaff}
td .t{color:var(--faint);font-size:10px;margin-left:4px}
td a{color:var(--primary);font-weight:700}
td.amt{font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}
.d-refunded{background:#2f6bff}.d-refinit{background:#4b3bd0}.d-pending{background:#f2a100}.d-failed{background:#e5484d}.d-success{background:#2eb15a}.d-cancel{background:#9a9ab0}
.pager{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;align-items:center}
.pg{min-width:30px;height:30px;border-radius:15px;border:1px solid var(--line2);display:grid;place-items:center;font-size:11px;font-weight:500;background:#fff;padding:0 8px}
.pg.wide{background:#ececec;border-color:transparent;min-width:40px}
.pg.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.menu{position:absolute;z-index:30;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(37,37,60,.14);padding:6px;min-width:176px}
.menu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:8px;font-size:12px;font-weight:500}
.menu button:hover{background:var(--primary-soft)}
.menu button[disabled]{color:var(--faint);cursor:not-allowed;background:none}
.filter{right:0;top:44px;width:266px;padding:16px;z-index:30;position:absolute}
.filter label{display:block;font-size:11px;color:var(--muted);margin:0 0 6px;font-weight:500}
.filter .f{margin-bottom:12px;position:relative}
.field{width:100%;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;background:#fff;font-size:12px;display:flex;justify-content:space-between;align-items:center;text-align:left;outline:0}
.filter .acts{display:flex;gap:8px}
.btn{height:40px;border-radius:24px;padding:0 24px;font-size:14px;font-weight:600;display:inline-flex;gap:8px;align-items:center;justify-content:center;border:1px solid var(--line2);background:#fff;white-space:nowrap}
.btn.sm{height:32px;padding:0 16px;font-size:12px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.dark{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.danger{background:#ea4a4f;border-color:#ea4a4f;color:#fff}
.btn.outline-red{border-color:#e5484d;color:#c8262c}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.back{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:500;width:max-content}
.back .iconbtn{width:32px;height:32px}
.head{background:#fff;border-radius:24px;padding:16px}
.hrow{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.hpanel,.inner{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.hpanel{background:var(--panel);border-radius:16px;padding:14px 16px;margin-top:16px}
.hstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
.inner{background:#fff;border-radius:12px;padding:14px 16px;margin:0 0 12px}
.hpanel small,.hstrip small,.inner small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px;font-weight:500}
.hpanel b,.hstrip b,.inner b{font-size:11px;font-weight:600;display:flex;gap:6px;align-items:center}
.head .amt{font-size:32px;font-weight:700;letter-spacing:-.5px;display:flex;align-items:center;gap:12px}
.head .meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin-top:6px;font-weight:500}
.head .acts{display:flex;gap:12px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:4px 10px;border-radius:12px;border:1px solid}
.b-success{background:var(--green-bg);color:var(--green-ink);border-color:#9fd8b4}
.b-failed{background:var(--red-bg);color:var(--red-ink);border-color:#f0a8a8}
.b-pending{background:var(--amber-bg);color:var(--amber-ink);border-color:#f0cf86}
.b-refinit{background:var(--primary-soft);color:#2f1a99;border-color:#c2b8f3}
.b-cancelled{background:#ececf2;color:var(--muted);border-color:#d9d9e8}
.b-refunded{background:var(--blue-bg);color:var(--blue-ink);border-color:#aec6f7}
.banner{display:flex;gap:12px;align-items:center;border-radius:12px;padding:12px 16px}
.banner .tx{flex:1}
.banner b{display:block;font-size:13px;font-weight:700;margin-bottom:2px}
.banner span{font-size:11px;font-weight:500}
.ban-failed{background:#fce8e8;color:var(--red-ink)}
.ban-pending{background:var(--amber-bg);color:var(--amber-ink)}
.ban-info{background:#e5ecff;color:var(--blue-ink)}
.ban-success{background:#e0f5e8;color:var(--green-ink)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.sec{background:#fff;border-radius:24px;padding:16px 20px 20px}
.sec h3{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;margin-bottom:16px;color:var(--ink)}
.sec h3 svg{color:var(--primary)}
.sec h3 .badge{margin-left:auto}
.panel{background:var(--panel);border-radius:16px;padding:0 16px}
.line{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line2)}
.line:last-child{border-bottom:0}
.line b{font-weight:500;font-size:13px;display:flex;gap:6px;align-items:center}
.line small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.line .v{font-weight:700;font-size:13px}.line .v.n{font-weight:500}.line .v.faint{color:var(--faint)}
.net{margin-top:16px;border-radius:16px;padding:16px;display:flex;justify-content:space-between;align-items:center}
.net b{font-size:13px;font-weight:600;display:block}.net small{font-size:11px;color:var(--muted);display:block;margin-top:4px}.net .v{font-size:22px;font-weight:700}
.net.green{background:#dff3e6}.net.green .v{color:#0f9d4a}
.net.neutral{background:var(--panel)}.net.neutral .v{color:var(--muted)}
.net.amber{background:var(--amber-bg)}.net.amber .v{color:var(--amber-ink)}
.net.red{background:#fce8e8}.net.red .v{color:var(--red-ink)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 12px;background:var(--panel);border-radius:16px;padding:16px}
.grid4 small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px;font-weight:500}
.grid4 b{font-size:11px;font-weight:600;display:flex;gap:6px;align-items:center}
.cust{background:var(--panel);border-radius:16px;padding:4px 16px}
.cust .rw{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}.cust .rw:last-child{border:0}
.cust small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px;font-weight:500}.cust b{font-size:11px;font-weight:600}
.tl{background:var(--panel);border-radius:16px;padding:12px 16px}
.ti{display:flex;gap:12px;position:relative;padding-bottom:14px}
.ti:last-child{padding-bottom:0}
.ti .bul{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative;z-index:1;margin-top:2px}
.ti:not(:last-child):before{content:"";position:absolute;left:11px;top:28px;bottom:-2px;width:2px;background:#dcdcea}
.ti .bul.done{background:#d6f0de;color:#12a150}.ti .bul.fail{background:#fadada;color:#d92d3a}.ti .bul.wait{background:#e6e1fb;color:var(--primary)}.ti .bul.idle{background:#e8e8ee}
.ti b{font-size:13px;font-weight:600;display:block}.ti.fail b{color:var(--red-ink)}.ti small{font-size:11px;color:var(--muted);display:block;margin-top:3px}.ti.idle b{color:var(--muted)}
.rtable thead th{font-size:10px}.rtable td{font-size:11px;font-weight:500;border:0;height:40px}.rtable td b{font-weight:700}
.copy{color:var(--primary)}
.overlay{position:fixed;inset:0;background:rgba(37,37,60,.5);display:grid;place-items:center;z-index:100;padding:16px;overflow:auto}
.modal{background:#fff;border-radius:24px;padding:24px;width:440px;max-width:100%;position:relative}
.modal.wide{width:520px}
.modal h4{font-size:18px;font-weight:600;letter-spacing:-.2px}
.modal .sub{font-size:11px;color:var(--muted);margin-top:4px;font-weight:500}
.modal .x{position:absolute;right:20px;top:24px;width:24px;height:24px;display:grid;place-items:center;color:var(--ink)}
.modal .lbl{font-size:11px;color:var(--muted);font-weight:500;margin:16px 0 6px;display:block}
.input{width:100%;border:1px solid var(--line2);border-radius:12px;padding:11px 12px;font-size:13px;background:#fff;outline:0;display:flex;justify-content:space-between;align-items:center}
.input:focus-within{border-color:var(--primary)}
.input input{border:0;outline:0;flex:1;background:none;font-size:13px;min-width:0}
.input.filled{background:var(--panel);border-color:var(--line)}
.tag{font-size:11px;font-weight:500;border:1px solid var(--line2);border-radius:10px;padding:3px 8px;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line2);border-radius:20px;padding:8px 14px;font-size:12px;font-weight:500;background:#fff;display:inline-flex;gap:6px;align-items:center}
.chip.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.sumbox{background:var(--panel);border-radius:12px;padding:12px 14px;margin-top:16px;display:flex;flex-direction:column;gap:8px}
.sumbox div{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:500}.sumbox b{color:var(--ink);font-weight:600}.sumbox .red{color:#d92d3a}.sumbox .bl{color:#1e4fc2}
.note{font-size:11px;color:var(--muted);margin-top:12px}
.callout{margin-top:16px;background:#e5ecff;color:#1e4fc2;border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.callout b{font-size:13px;font-weight:700;display:block;margin-bottom:4px}.callout span{font-size:11px;line-height:1.4;display:block}.callout .tx{flex:1}
.foot{display:flex;gap:12px;justify-content:flex-end;margin-top:20px}
.foot .btn{flex:1}
.foot.end .btn{flex:none;min-width:128px}
.msgbox{border:1px solid var(--line2);border-radius:12px;padding:12px;font-size:13px;line-height:1.5;color:var(--ink);width:100%;resize:vertical;min-height:100px;outline:0;font-family:inherit}
.center{text-align:center}
.hero{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin:12px auto 12px}
.hero.g{background:#d9f2e2;color:#12a150}.hero.a{background:#fdf0d2;color:#c27a00}
.center .sub{margin:8px auto 0;max-width:340px;font-size:11px;line-height:1.5}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 20px;border-radius:24px;font-size:13px;font-weight:500;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.empty{text-align:center;color:var(--faint);padding:40px 0;font-size:13px}
.head .meta{flex-wrap:wrap}.head .acts{flex-wrap:wrap}
@media (max-width:1000px){.cols{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.grid4,.hpanel,.inner{grid-template-columns:repeat(2,1fr)}.hstrip{grid-template-columns:repeat(3,1fr)}.card{overflow-x:auto}}
@media (max-width:640px){.side{display:none}.hrow{flex-direction:column;align-items:flex-start}}
</style>
</head>

function Icon({n,s=20,sw=1.8,c}){

function useNow(on){ const [n,setN]=useState(Date.now()); useEffect(()=>{ if(!on) return; const t=setInterval(()=>setN(Date.now()),1000); return ()=>clearInterval(t)},[on]); return n; }
/* route lives in state and mirrors to the URL hash when the browser allows it (e.g. not in sandboxed previews) */
function useRoute(){

}

  const refTl=[["done","Payment captured",`29 Oct 2026, ${t.time} · UTR ${t.utr}`]];
  if(t.status==="success"){

  return out;
}

          <div className={"net "+m.net.cls}><div><b>{m.net.title}</b><small>{m.net.sub}</small></div><span className="v">{m.net.v}</span></div>
        </section>
        {m.det&&<section className="sec"><h3><Icon n="file" s={18}/>Transaction details</h3>
          <div className="grid4">{m.det.map(([k,v,c])=><div key={k}><small>{k}</small><b>{v}{c?<CopyBtn v={v} toast={toast}/>:null}</b></div>)}</div>
        </section>}
      </div>
      <div className="col">
        <section className="sec"><h3><Icon n="clock" s={18}/>Payment timeline<span className={"badge "+STATUS[m.tlBadge].badge}>{STATUS[m.tlBadge].label}</span></h3>
          <div className="tl">{m.tl.map(([k,a,b])=><div className={"ti "+k} key={a}>
            <span className={"bul "+k}>{k==="done"&&<Icon n="check" s={14} sw={2.4}/>}{k==="fail"&&<Icon n="x" s={14} sw={2.4}/>}{k==="wait"&&<Icon n="clock" s={14}/>}</span>
            <div><b>{a}</b><small>{b}</small></div></div>)}</div>
        </section>
        <section className="sec"><h3><Icon n="user" s={18}/>Customer &amp; payment</h3>
          <div className="cust">{m.custRows.map((row,i)=><div className="rw" key={i} style={row.length===1?{gridTemplateColumns:"1fr"}:null}>{row.map(([k,v])=><div key={k}><small>{k}</small><b>{v}</b></div>)}</div>)}
          </div>
        </section>
      </div>
    </div>
    {m.refunds&&<section className="sec"><h3><Icon n="undo" s={18}/>Refunds</h3>
      <table className="rtable"><thead><tr>{["Refund ID","Amount","Initiated","Mode","ARN","Status"].map(h=><th key={h}>{h}</th>)}</tr></thead>
      <tbody>{m.refunds.map(r=><tr key={r[0]}><td>{r[0]}</td><td><b>{r[1]}</b></td><td>{r[2]}</td><td>{r[3]}</td><td>{r[4]}</td><td><i className={"dot "+(r[5]==="success"?"d-success":r[5]==="cancel"?"d-cancel":"d-refunded")}/>{r[6]}</td></tr>)}</tbody></table>
    </section>}
    {modal==="refund"&&<RefundModal t={t} close={closeM} onDone={(refund)=>{dispatch({type:"refund",irn:t.irn,refund}); setModal({done:refund})}}/>}
    {modal&&modal.done&&<RefundDone t={t} r={modal.done} close={()=>setModal(null)}/>}
    {modal==="resend"&&<ResendModal t={t} close={closeM} send={()=>{closeM();toast("Payment link sent to "+first(t.cust))}}/>}
    {modal==="shareFail"&&<ShareFailModal t={t} close={closeM} send={()=>{closeM();toast("Message sent to "+first(t.cust))}}/>}
    {modal==="share"&&<ShareReceiptModal t={t} close={closeM} send={()=>{closeM();toast("Receipt sent to "+first(t.cust))}}/>}
    {modal==="cancel"&&<CancelModal t={t} now={now} close={closeM} onKeep={closeM} onCancel={(reason)=>{dispatch({type:"cancelRefund",irn:t.irn,reason,at:hhmm(new Date())});closeM();toast("Refund cancelled")}} late={()=>setModal("late")}/>}
    {modal==="late"&&<LateModal t={t} close={()=>{closeM()}} onDone={()=>{dispatch({type:"processed",irn:t.irn});closeM()}} toast={toast}/>}
  </Shell>;
}

/* ---------- modals ---------- */
function Modal({children,close,wide}){
  useEffect(()=>{const k=e=>e.key==="Escape"&&close(); addEventListener("keydown",k); return()=>removeEventListener("keydown",k)},[close]);
  return <div className="overlay" onMouseDown={e=>e.target===e.currentTarget&&close()}><div className={"modal"+(wide?" wide":"")} role="dialog" aria-modal="true">{children}</div></div>;
}
const XBtn=({close})=><button className="x" onClick={close} aria-label="Close"><Icon n="x" s={20}/></button>;
function Chips({items,sel,toggle,multi}){ return <div className="chips">{items.map(i=>{const on=multi?sel.includes(i):sel===i;
  return <button key={i} className={"chip"+(on?" on":"")} onClick={()=>toggle(i)}>{on&&<Icon n="check" s={14} sw={2.2}/>}{i}</button>})}</div>; }
function Callout({title,children}){ const [o,setO]=useState(true); if(!o)return null;
  return <div className="callout"><Icon n="info" s={20}/><div className="tx"><b>{title}</b><span>{children}</span></div><button onClick={()=>setO(false)} aria-label="Dismiss"><Icon n="x" s={16}/></button></div>; }
function useChannels(){ const [c,setC]=useState(["WhatsApp","SMS"]); return [c,i=>setC(c.includes(i)?c.filter(x=>x!==i):[...c,i])]; }

function RefundModal({t,close,onDone}){
  const [amt,setAmt]=useState(String(t.amount.toFixed(2))); const [why,setWhy]=useState("Customer request");
  const n=parseFloat(amt); const bad=!(n>0&&n<=t.amount);
  const full=n===t.amount;
  const {f}=fees(t.amount);
  return <Modal close={close}><XBtn close={close}/>
    <h4>Refund payment</h4><div className="sub">{inr(t.amount)} · {t.order} · {t.cust}</div>
    <span className="lbl">Refund amount</span>
    <div className="input filled" style={bad?{borderColor:"var(--red)"}:null}><span style={{marginRight:6}}>₹</span><input inputMode="decimal" value={amt} onChange={e=>setAmt(e.target.value.replace(/[^0-9.]/g,""))}/>
      <button className="tag" onClick={()=>setAmt(t.amount.toFixed(2))}>{full?"Full payment":"Set full"}</button></div>
    {bad&&<div className="note" style={{color:"var(--red-ink)"}}>Enter an amount up to {inr(t.amount)}.</div>}
    <span className="lbl">Reason</span>
    <Chips items={["Customer request","Duplicate payment","Order cancelled","Item unavailable","Other"]} sel={why} toggle={setWhy}/>
    <div className="sumbox">
      <div>Refund to<b>{first(t.cust)}’s UPI · {t.contact}</b></div><div>Arrives<b>Instantly (UPI)</b></div>
      <div>Platform fee<b>Not returned · {inr(f)}</b></div><div>Deducted from<b>Next settlement</b></div></div>
    <p className="note">You can cancel this refund until the bank starts processing it.</p>
    <div className="foot"><button className="btn" onClick={close}>Cancel</button>
      <button className="btn dark" disabled={bad} onClick={()=>onDone({id:"RFD-20432",state:"queued",at:hhmm(new Date()),deadline:Date.now()+10*60*1000,amount:n})}>Refund {inr(bad?0:n)}</button></div>
  </Modal>;
}
function RefundDone({t,r,close}){
  return <Modal close={close}><XBtn close={close}/>
    <div className="center"><div className="hero g"><Icon n="circleCheck" s={28}/></div><h4>Refund initiated</h4>
      <p className="sub">{inr(r.amount||t.amount)} is on its way to {first(t.cust)}’s account and should arrive instantly. We’ll email the confirmation.</p></div>
    <div className="sumbox" style={{marginTop:20}}><div>Refund ID<b>{r.id}</b></div><div>Status<b>Processing</b></div></div>
    <div className="foot"><button className="btn" onClick={close}>Cancel</button><button className="btn dark" onClick={close}>Done</button></div>
  </Modal>;
}
function ResendModal({t,close,send}){
  const [ch,tg]=useChannels(); const [v,setV]=useState("24 hours");
  return <Modal close={close}><XBtn close={close}/>
    <h4>Resend payment link</h4><div className="sub">Create a fresh link for {t.order} · {inr(t.amount)}</div>
    <span className="lbl">Send to</span><div className="input">{t.phone} · {t.cust}</div>
    <span className="lbl">Send via</span><Chips multi items={["WhatsApp","SMS","Email"]} sel={ch} toggle={tg}/>
    <span className="lbl">Link valid for</span>
    <select className="input" value={v} onChange={e=>setV(e.target.value)}>{["1 hour","6 hours","24 hours","7 days"].map(o=><option key={o}>{o}</option>)}</select>
    <Callout title="This creates a new payment">The failed attempt stays as Failed. If the customer pays through the new link, it appears as a separate transaction.</Callout>
    <div className="foot end"><button className="btn" onClick={close}>Cancel</button><button className="btn primary" disabled={!ch.length} onClick={send}>Send link</button></div>
  </Modal>;
}
function ShareFailModal({t,close,send}){
  const [ch,tg]=useChannels();
  const [msg,setMsg]=useState(`Hi ${first(t.cust)}, your payment of ${inr(t.amount)} for ${t.order} didn’t go through. Your bank declined the card (code 05 · Do not honour). No money was collected. Please try another card or UPI.`);
  return <Modal close={close}><XBtn close={close}/>
    <h4>Share failure reason</h4><div className="sub">Explain to the customer why {t.order} · {inr(t.amount)} failed</div>
    <span className="lbl">Send to</span><div className="input">{t.phone} · {t.cust}</div>
    <span className="lbl">Send via</span><Chips multi items={["WhatsApp","SMS","Email"]} sel={ch} toggle={tg}/>
    <span className="lbl">Message preview</span><textarea className="msgbox" value={msg} onChange={e=>setMsg(e.target.value)}/>
    <Callout title="No payment link is included">This message only explains the failure. Use Resend payment link if you want the customer to pay again.</Callout>
    <div className="foot end"><button className="btn" onClick={close}>Cancel</button><button className="btn primary" disabled={!ch.length||!msg.trim()} onClick={send}>Send message</button></div>
  </Modal>;
}
function ShareReceiptModal({t,close,send}){
  const [ch,tg]=useChannels();
  return <Modal close={close}><XBtn close={close}/>
    <h4>Share receipt</h4><div className="sub">{t.order} · {inr(t.amount)} · Paid 29 Oct 2026, {t.time}</div>
    <span className="lbl">Send to</span><div className="input">{t.phone} · {t.cust}</div>
    <span className="lbl">Send via</span><Chips multi items={["WhatsApp","SMS","Email"]} sel={ch} toggle={tg}/>
    <span className="lbl">Include</span><div className="input">Payment receipt · PDF</div>
    <Callout title="The customer sees only their own details">Fees, settlement and internal IDs are never included in the shared receipt.</Callout>
    <div className="foot end"><button className="btn" onClick={close}>Cancel</button><button className="btn primary" disabled={!ch.length} onClick={send}>Send receipt</button></div>
  </Modal>;
}
function CancelModal({t,now,close,onKeep,onCancel,late}){
  const [why,setWhy]=useState("Created by mistake"); const left=t.refund.deadline-now;
  useEffect(()=>{ if(left<=0) late(); },[left<=0]);
  const {amount}=t;
  return <Modal close={close} wide><XBtn close={close}/>
    <h4>Cancel this refund?</h4><div className="sub">It has not reached the bank yet</div>
    <div className="sumbox" style={{marginTop:16}}><div>Refund ID<b>{t.refund.id}</b></div><div>Amount<b>{inr(amount)}</b></div><div>To<b>{t.cust} · {t.contact}</b></div><div>Goes to bank in<b className="red">{fmtLeft(left)}</b></div></div>
    <span className="lbl">Reason (optional)</span>
    <Chips items={["Created by mistake","Wrong amount","Customer changed mind","Other"]} sel={why} toggle={i=>setWhy(why===i?"":i)}/>
    <Callout title="">The payment goes back to Success and {inr(amount)} can be refunded again later. The customer is not notified.</Callout>
    <div className="foot end"><button className="btn" onClick={onKeep}>Keep refund</button><button className="btn danger" onClick={()=>onCancel(why)}>Cancel refund</button></div>
  </Modal>;
}
function LateModal({t,close,onDone,toast}){
  return <Modal close={close}><XBtn close={close}/>
    <div className="center"><div className="hero a"><Icon n="alert" s={28}/></div><h4>Too late to cancel this refund</h4>
      <p className="sub">{t.refund.id} was sent to {t.bank} at 4:12 PM. Refunds already with the bank cannot be stopped. {first(t.cust)} should see the money within a few minutes.</p></div>
    <div className="sumbox" style={{marginTop:20}}><div>Refund ID<b>{t.refund.id}</b></div><div>Status<b className="bl">Processing</b></div></div>
    <div className="foot"><button className="btn" onClick={()=>{toast("Query raised with support")}}>Raise a query</button><button className="btn dark" onClick={onDone}>Got it</button></div>
  </Modal>;
}

/* ---------- app ---------- */
function reducer(s,a){
  const upd=(irn,fn)=>s.map(t=>t.irn===irn?fn(t):t);
  if(a.type==="refund") return upd(a.irn,t=>({...t,status:"refinit",refund:a.refund}));
  if(a.type==="cancelRefund") return upd(a.irn,t=>({...t,status:"success",refund:{...t.refund,state:"cancelled",reason:a.reason,cancelledAt:a.at}}));
  if(a.type==="processed") return upd(a.irn,t=>({...t,status:"refunded",refund:{...t.refund,state:"processed",arn:"640128845520"}}));
  return s;
}
function App(){
  const [txns,dispatch]=React.useReducer(reducer,SEED.map(mkTxn));
  const [hash,nav]=useRoute(); const [msg,setMsg]=useState(null);
  const toast=m=>{setMsg(m); clearTimeout(toast.t); toast.t=setTimeout(()=>setMsg(null),2200)};
  const mt=hash.match(/^#\/txn\/([^/?]+)(?:\?m=(\w+))?/);
  const go=(irn,m)=>nav("#/txn/"+irn+(m?"?m="+m:""));
  const t=mt&&txns.find(x=>x.irn===mt[1]);
  useEffect(()=>{window.scrollTo(0,0)},[mt&&mt[1]]);
  return <>
    {t?<Detail key={t.irn+(mt[2]||"")} t={t} txns={txns} dispatch={dispatch} toast={toast} initial={mt[2]} back={()=>nav("#/")}/>
      :<List txns={txns} go={go} openAction={(k)=>toast("Receipt downloaded")}/>}
    {msg&&<div className="toast" role="status">{msg}</div>}
  </>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
